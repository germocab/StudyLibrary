<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biblioteca de estudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#222;--mut:#6c6c6c;--chip:#efefef;--sheet:#f3f3f3;--card:#fff;--or:#e37b00;--blue:#2a6fc4;--pur:#6b3fa0;--line:#e2e2e2;--ic:#5b3c88;--fs:17px;
--pink:#ec5f9a;--orange:#f08a1c;--yellow:#f2c600;--green:#4cae5a;--bl:#3b8be0;--purple:#8a5bd0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151515;--ink:#ececec;--mut:#a0a0a0;--chip:#2b2b2b;--sheet:#202020;--card:#2a2a2a;--blue:#7db4f5;--line:#383838}}
:root[data-theme="dark"]{--bg:#151515;--ink:#ececec;--mut:#a0a0a0;--chip:#2b2b2b;--sheet:#202020;--card:#2a2a2a;--blue:#7db4f5;--line:#383838}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ic:#b89ce6}}:root[data-theme="dark"]{--ic:#b89ce6}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.app.op:not(.focus) .main{margin-right:404px}.main{transition:margin .28s}}
.main{display:flex;flex-direction:column;min-height:0}
.hd{display:flex;align-items:center;gap:8px;padding:10px 14px;position:relative}
.hd .t{flex:1;min-width:0}.hd b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hd small{color:var(--mut);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:50%;color:var(--ic);background:var(--chip);display:grid;place-items:center;flex:none}
.ib.on{background:#5b3c88;color:#fff}[data-a=save].on svg{fill:currentColor}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:520px){.hd{gap:5px;padding:8px}.ib{width:34px;height:34px}.hd .opt{display:none}}
.sb{display:none;gap:8px;padding:0 14px 8px;align-items:center}.sb.on{display:flex}
.sb input{flex:1;border:0;background:var(--chip);border-radius:99px;padding:10px 16px;min-width:0}
.sc{flex:1;overflow:auto;padding:8px 20px 120px}
.pg{max-width:720px;margin:0 auto}
.lab{background:var(--or);color:#fff;font-weight:600;font-size:13px;padding:5px 12px;border-radius:0 10px 10px 0;margin:6px 0 16px -20px;letter-spacing:.02em;text-transform:uppercase}
h1{color:var(--or);font-size:clamp(26px,5vw,34px);line-height:1.12;margin:0 0 20px;font-weight:700}
.p{font-size:var(--fs);line-height:1.6;margin:0 0 1em;white-space:pre-wrap}
figure{margin:0 0 1.2em}figure img{width:100%;border-radius:20px;display:block}figcaption{font-size:13px;color:var(--mut);margin-top:6px}
.ref{color:var(--blue);font-weight:600;cursor:pointer}
.hl{border-radius:5px;cursor:pointer;background:color-mix(in srgb,var(--c) 40%,transparent)}
.c-pink{--c:var(--pink)}.c-orange{--c:var(--orange)}.c-yellow{--c:var(--yellow)}.c-green{--c:var(--green)}.c-blue{--c:var(--bl)}.c-purple{--c:var(--purple)}
.sr{background:#ffd54a;color:#000;border-radius:4px}
.card{background:var(--card);border-radius:22px;padding:14px 16px;margin-bottom:12px;border:1px solid var(--line)}
.lib .card{display:flex;gap:12px;align-items:center;text-align:left;width:100%}.lib .card .lb{background:var(--or);color:#fff;border-radius:12px;padding:6px 10px;font-weight:600;font-size:13px}
.btn{background:var(--ink);color:var(--bg);border-radius:99px;padding:10px 18px;font-weight:600}.btn.s{background:var(--chip);color:var(--ink)}
.st{background:var(--sheet);overflow:auto;padding:12px 14px 24px;display:flex;flex-direction:column;position:fixed;z-index:20;right:12px;top:12px;bottom:12px;width:380px;max-width:calc(100% - 16px);border-radius:28px;transform-origin:calc(100% - 40px) calc(100% - 40px);transition:transform .3s cubic-bezier(.3,.8,.3,1),opacity .2s,border-radius .3s,visibility 0s}
.st.cl{transform:scale(.1);opacity:0;visibility:hidden;pointer-events:none;border-radius:50%;transition:transform .3s,opacity .25s,border-radius .3s,visibility 0s .3s}
.hdl{width:100%;padding:4px 0 14px;flex:none;touch-action:none;cursor:grab}.hdl::after{content:"";display:block;width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.nv{white-space:pre-wrap;font-size:15px;line-height:1.55;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.dn{width:42px;height:42px;border-radius:50%;background:#5b3c88;color:#fff;display:grid;place-items:center}[data-theme=dark] .dn,.dn svg{color:inherit}.dn svg{stroke:#fff}
.cd{display:flex;gap:8px;margin:8px 0}.cd i{width:26px;height:26px;border-radius:50%;background:var(--c);cursor:pointer;border:2px solid transparent}.cd i.s{border-color:var(--ink)}
.pm{position:fixed;background:var(--card);border-radius:20px;border:1px solid var(--line);box-shadow:0 10px 30px #0004;padding:6px;z-index:70;display:none;min-width:150px}.pm.on{display:block}.pm button{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;width:100%}.pm button:hover{background:var(--chip)}
.hn{text-decoration:underline dotted;text-underline-offset:3px}
@media(max-width:899px){.st{left:8px;right:8px;top:auto;bottom:0;width:auto;max-width:none;height:62dvh;border-radius:28px 28px 0 0;box-shadow:0 -6px 30px #0004;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}.st.cl{border-radius:50%}}
@media(prefers-reduced-motion:reduce){.st,.main,.fab{transition:none;animation:none}}
.tabs{display:flex;gap:6px;background:var(--chip);border-radius:99px;padding:4px;margin-bottom:12px}.tabs button{flex:1;padding:8px;border-radius:99px;font-weight:600;font-size:14px;color:var(--mut)}.tabs .on{background:var(--card);color:var(--ink)}
.bh{display:flex;gap:10px;align-items:center;margin-bottom:8px}.bi{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#355c9c,#6b8ed0);flex:none}.bh small{display:block;color:var(--mut);font-size:12px}.bh b{font-size:14px}
.vt{font-size:15px;line-height:1.5}.rf{font-weight:700;font-size:15px;margin:2px 0 6px}
.q{border-left:4px solid var(--c);padding-left:10px;font-size:14px;color:var(--mut);margin-bottom:8px;cursor:pointer}
textarea.n,.card textarea{width:100%;border:0;background:var(--chip);border-radius:14px;padding:10px 12px;resize:none;min-height:70px}
.emp{color:var(--mut);text-align:center;padding:30px 16px;font-size:14px}
.look{display:flex;gap:8px;margin-bottom:12px}.look input{flex:1;border:0;background:var(--card);border-radius:99px;padding:10px 14px;min-width:0}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--pur);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px #0004;z-index:10}
.fab svg{width:26px;height:26px;stroke:#fff}.fab{animation:pop .3s}@keyframes pop{from{transform:scale(.3);opacity:0}}
.tb{position:fixed;display:none;background:var(--card);border:1px solid var(--line);padding:7px 9px;border-radius:99px;gap:6px;align-items:center;z-index:50;box-shadow:0 6px 20px #0005}.tb.on{display:flex}
.tb i{width:26px;height:26px;border-radius:50%;background:var(--c);display:block;border:2px solid var(--bg);cursor:pointer}
.tb button{color:var(--ic);width:28px;height:28px;display:grid;place-items:center}
.menu{position:absolute;right:12px;top:58px;background:var(--card);border-radius:22px;box-shadow:0 10px 36px #0004;padding:8px;z-index:40;min-width:230px;display:none;border:1px solid var(--line)}.menu.on{display:block}.menu svg,.pm svg{color:var(--ic)}
.menu button{display:flex;gap:12px;align-items:center;width:100%;padding:11px 14px;border-radius:14px;text-align:left}.menu button:hover{background:var(--chip)}
.menu .row{display:flex;gap:8px;padding:8px 14px;align-items:center;justify-content:space-between}.menu .row span{font-size:14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;z-index:60;display:none}
.ed{width:100%;border:1.5px dashed var(--line);border-radius:18px;padding:12px 14px;background:transparent;font-size:var(--fs);line-height:1.55;resize:none;margin-bottom:6px;display:block}
.ti{font:700 28px Figtree;color:var(--or);width:100%;border:1.5px dashed var(--line);border-radius:16px;padding:8px 12px;background:transparent;margin-bottom:14px}
.li{border:1.5px dashed var(--line);border-radius:12px;background:transparent;padding:5px 10px;margin:0 0 14px;font-weight:600;font-size:13px;width:100%}
.bar{display:flex;gap:6px;margin-bottom:14px}.bar button{background:var(--chip);border-radius:99px;padding:5px 12px;font-size:13px}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.hint{color:var(--mut);font-size:13px;margin-bottom:12px}
</style></head><body>
<div class="app" id="app">
 <div class="main">
  <div class="hd" id="hd"></div>
  <div class="sb" id="sb"><input id="qi" placeholder="Buscar en el artículo" aria-label="Buscar"><span id="qc" style="font-size:13px;color:var(--mut)"></span><button class="ib" data-a="nx" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button></div>
  <div class="sc" id="sc"><div class="pg" id="pg"></div></div>
 </div>
 <aside class="st" id="st" aria-label="Estudio"></aside>
</div>
<button class="fab" id="fab" data-a="study" aria-label="Abrir pestaña de estudio"><svg viewBox="0 0 24 24"><path d="M6 4h12l4 5-10 11L2 9zM2 9h20M9 4l-2 5 5 11 5-11-2-5"/></svg></button>
<div class="tb" id="tb"></div><div class="pm" id="pm"></div><div class="toast" id="ts"></div>
<input type="file" id="fi" accept="image/*" hidden>
<script>
const $=s=>document.querySelector(s),E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IC={back:'M15 5l-7 7 7 7',head:'M4 15v-3a8 8 0 0116 0v3M4 14h3v6H5a1 1 0 01-1-1zm16 0h-3v6h2a1 1 0 001-1z',srch:'M11 4a7 7 0 100 14 7 7 0 000-14zm9 16l-4.2-4.2',bm:'M7 4h10v16l-5-4-5 4z',lang:'M4 6h9M8 4v2m-3 6c3-1 5-4 6-8M6 9c1 2 3 4 5 5m3 6l4-10 4 10m-7-3h6',dots:'M5 12h.01M12 12h.01M19 12h.01',note:'M5 4h14v12l-4 4H5zM15 20v-4h4M8 9h8M8 13h4',tr:'M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13',pl:'M12 5v14M5 12h14',x:'M6 6l12 12M18 6L6 18',ed:'M4 20l4-1L19 8l-3-3L5 16zM14 7l3 3',fs:'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5',tx:'M4 19l5-14 5 14M6 14h6M16 19l3-8 2 8',im:'M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4M9 9h.01',ok:'M5 12l5 5 9-10',up:'M6 15l6-6 6 6',dn:'M6 9l6 6 6-6'};
const ic=n=>`<svg viewBox="0 0 24 24"><path d="${IC[n]}"/></svg>`;
const COLS=['pink','orange','yellow','green','blue','purple'],CN={pink:'Rosa',orange:'Naranja',yellow:'Amarillo',green:'Verde',blue:'Azul',purple:'Morado'};
const RE=/(?:[12] )?(?:Génesis|Éxodo|Levítico|Números|Deuteronomio|Josué|Jueces|Rut|Salmos?|Proverbios|Eclesiastés|Isaías|Jeremías|Daniel|Mateo|Marcos|Lucas|Juan|Hechos|Romanos|Corintios|Gálatas|Efesios|Filipenses|Colosenses|Tesalonicenses|Timoteo|Hebreos|Santiago|Pedro|Apocalipsis) \d+:\d+(?:[-–]\d+)?/g;
const VS={'Génesis 1:1':'En el principio crió Dios los cielos y la tierra.','Números 13:30':'Entonces Caleb hizo callar al pueblo delante de Moisés, y dijo: Subamos luego, y tomemos posesión de ella; porque más podremos nosotros que ella.','Salmos 23:1':'Jehová es mi pastor; nada me faltará.','Juan 3:16':'Porque de tal manera amó Dios al mundo, que ha dado á su Hijo unigénito, para que todo aquel que en él cree, no se pierda, mas tenga vida eterna.'};
const seed=()=>({fs:17,verses:{},hl:[],arts:[{id:'a1',label:'12. Caleb',sub:'Seamos valientes al andar con Dios',title:'Luchó lealmente a favor de su Dios',saved:false,blocks:[
{type:'p',text:'Hace mucho tiempo, un hombre llamado Caleb vivió entre esclavos israelitas en Egipto. Aunque creció siendo esclavo, vio con sus propios ojos cómo Jehová liberó a su pueblo. Más adelante, él sabía que el mismo Dios que creó los cielos y la tierra (Génesis 1:1) podía darles la victoria.'},
{type:'p',text:'Cuando Moisés envió a doce hombres a explorar Canaán, diez volvieron con miedo. Caleb, en cambio, habló con valor y confianza (Números 13:30). Su lealtad no dependía de lo que veían, sino de en quién confiaban.'},
{type:'p',text:'Prueba a seleccionar texto para resaltarlo o añadir una nota. Toca cualquier texto bíblico en azul para verlo en la pestaña de estudio.'}]}]});
let S;try{S=JSON.parse(localStorage.getItem('jwl2'))||seed()}catch(e){S=seed()}
const save=()=>{try{localStorage.setItem('jwl2',JSON.stringify(S))}catch(e){}};
let cur=null,q='',sv0=null,edit=false,pend=null,sOpen=innerWidth>=900,sOn=false,lc='yellow',ri=-1;
const A=()=>S.arts.find(a=>a.id==cur),uid=()=>Math.random().toString(36).slice(2,9);
const toast=m=>{const t=$('#ts');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',1800)};
const vtext=r=>S.verses[r]||VS[r];

function seg(a,bi){const t=a.blocks[bi].text||'',P=new Set([0,t.length]),H=S.hl.filter(h=>h.art==a.id&&h.b==bi),R=[...t.matchAll(RE)].map(m=>({s:m.index,e:m.index+m[0].length,r:m[0]})),Q=[];
 if(q.length>1){const lo=t.toLowerCase(),k=q.toLowerCase();let i=-1;while((i=lo.indexOf(k,i+1))>=0)Q.push({s:i,e:i+k.length})}
 [...H,...R,...Q].forEach(x=>{P.add(Math.min(x.s,t.length));P.add(Math.min(x.e,t.length))});
 const p=[...P].sort((x,y)=>x-y);let o='';
 for(let i=0;i<p.length-1;i++){const s=p[i],e=p[i+1],tx=E(t.slice(s,e)),h=H.find(h=>h.s<=s&&h.e>=e),r=R.find(r=>r.s<=s&&r.e>=e),z=Q.find(z=>z.s<=s&&z.e>=e);
  if(!h&&!r&&!z){o+=tx;continue}
  o+=`<span class="${h?'hl c-'+h.c+(h.note!=null?' hn':''):''}${r?' ref':''}${z?' sr':''}"${h?` data-h="${h.id}"`:''}${r?` data-r="${E(r.r)}"`:''}>${tx}</span>`}
 return o}

function header(){const a=A(),b=(n,l,x='',c='')=>`<button class="ib ${c}" data-a="${x||n}" aria-label="${l}">${ic(n)}</button>`;
 $('#hd').innerHTML=a?b('back','Volver','back')+`<div class="t"><b>${E(a.title)}</b><small>${E(a.sub||'')}</small></div>`+b('head','Medios','media')+b('srch','Buscar','search',sOn?'on':'')+b('bm','Guardar artículo','save',a.saved?'on':'')+`<span class="opt">${b('lang','Idioma','lang')}</span>`+b('dots','Más opciones','menu')
 :`<div class="t"><b>Mi biblioteca</b><small>Tus artículos de estudio</small></div>`+b('pl','Nuevo artículo','new')+`<button class="ib" data-a="theme" aria-label="Tema">◐</button>`;
 $('#hd').insertAdjacentHTML('beforeend','<div class="menu" id="mn"></div>')}
function menu(){const a=A();$('#mn').innerHTML=`<div class="row"><span>Tamaño del texto</span><span><button class="ib" data-a="fs-" aria-label="Menor">A−</button> <button class="ib" data-a="fs+" aria-label="Mayor">A+</button></span></div>
<button data-a="fs">${ic('fs')}Pantalla completa</button><button data-a="edit">${ic('ed')}${edit?'Terminar edición':'Editar artículo'}</button><button data-a="lang">${ic('lang')}Cambiar idioma</button><button data-a="del">${ic('tr')}Eliminar artículo</button>`}

function main(){const pg=$('#pg'),a=A();$('#sb').classList.toggle('on',sOn&&!!a);
 if(!a){pg.className='pg lib';pg.innerHTML=S.arts.map(x=>`<button class="card" data-a="open" data-v="${x.id}"><span class="lb">${E(x.label)}</span><span><b>${E(x.title)}</b><br><small style="color:var(--mut)">${x.blocks.length} bloques</small></span></button>`).join('')+`<div class="add"><button class="btn" data-a="new">Nuevo artículo</button></div>`;return}
 pg.className='pg';
 if(edit){pg.innerHTML=`<p class="hint">Modo edición: escribe tus párrafos. Los textos como “Juan 3:16” se convierten en enlaces bíblicos automáticamente.</p><input class="li" id="e-l" value="${E(a.label)}" aria-label="Etiqueta"><input class="ti" id="e-t" value="${E(a.title)}" aria-label="Título"><input class="li" id="e-s" value="${E(a.sub||'')}" aria-label="Subtítulo">`+a.blocks.map((b,i)=>`<div data-i="${i}"><div class="bar"><button data-a="up" data-v="${i}" aria-label="Subir">${ic('up')}</button><button data-a="dn" data-v="${i}" aria-label="Bajar">${ic('dn')}</button><button data-a="rm" data-v="${i}" aria-label="Borrar">${ic('tr')}</button></div>`+(b.type=='img'?`<figure><img src="${b.src}" alt=""></figure><input class="li" data-cap="${i}" value="${E(b.cap||'')}" placeholder="Pie de imagen">`:`<textarea class="ed" data-t="${i}" rows="3" placeholder="Escribe un párrafo">${E(b.text)}</textarea>`)+`</div>`).join('')+`<div class="add"><button class="btn" data-a="addp">${ic('pl')} Párrafo</button><button class="btn s" data-a="addimg">${ic('im')} Imagen</button><button class="btn s" data-a="addurl">Imagen por enlace</button><button class="btn s" data-a="edit">Listo</button></div>`;
  pg.querySelectorAll('textarea').forEach(rs);return}
 pg.innerHTML=`<div class="lab">${E(a.label)}</div><h1>${E(a.title)}</h1>`+a.blocks.map((b,i)=>b.type=='img'?`<figure><img src="${b.src}" alt="${E(b.cap)}">${b.cap?`<figcaption>${E(b.cap)}</figcaption>`:''}</figure>`:`<p class="p" data-b="${i}">${seg(a,i)}</p>`).join('');
 cnt()}
const rs=t=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'};
function cnt(){const n=document.querySelectorAll('.sr').length;$('#qc').textContent=q.length>1?n+' result.':''}

function study(){const st=$('#st');st.classList.toggle('cl',!sOpen);$('#app').classList.toggle('op',sOpen);$('#fab').style.display=sOpen?'none':'';
 let h='<div class="hdl" role="separator" aria-label="Desliza hacia abajo para cerrar"></div>',v=sv0;
 if(v&&v.t=='note'){const x=S.hl.find(k=>k.id==v.id);if(x){const ed=v.mode=='edit';h+=`<div class="card"><div class="q c-${x.c}" data-a="goto" data-v="${x.id}">${E(txt(x))}</div>`+(ed?`<div class="cd">${COLS.map(c=>`<i class="c-${c}${c==x.c?' s':''}" data-a="ncol" data-v="${c}" role="button" aria-label="${CN[c]}"></i>`).join('')}</div><textarea data-n="${x.id}" placeholder="Escribe tu nota" aria-label="Nota" rows="4">${E(x.note)}</textarea><div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="dn" data-a="done" aria-label="Listo">${ic('ok')}</button></div>`:`<div class="nv" data-nv="${x.id}">${x.note?E(x.note):'<span style="color:var(--mut)">Nota vacía</span>'}</div><div class="hint" style="margin:10px 0 0">Mantén pulsada la nota para editarla o eliminarla.</div>`)+`</div>`}}
 else if(v&&v.t=='bible'){const r=v.ref,t=vtext(r);h+=`<div class="card"><div class="bh"><span class="bi"></span><div><b>Biblia de Estudio</b><small>Español</small></div></div><div class="rf">${E(r)}</div>`+(t?`<div class="vt">${E(t)}</div>`:`<div class="hint">Este texto no está en la biblioteca de ejemplo. Escríbelo o pégalo para guardarlo.</div><textarea data-v2="${E(r)}" placeholder="Texto bíblico"></textarea><div class="bar" style="margin:8px 0 0"><button data-a="sv" data-v="${E(r)}">Guardar texto</button></div>`)+`</div>`}
 else h+='<div class="emp">Toca un texto bíblico o una nota para verlos aquí.</div>';
